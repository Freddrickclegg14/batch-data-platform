[project]
name = "batch-data-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.46.2",
    "google-cloud-storage>=3.17.1",
    "pandas>=3.0.6",
    "prefect>=3.8.8",
    "pyarrow>=25.0.1",
    "pyspark>=4.2.0",
    "python-dotenv>=1.2.4",
