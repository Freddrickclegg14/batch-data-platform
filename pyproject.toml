[project]
name = "batch-data-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dbt-bigquery>=1.12.1",
    "google-cloud-bigquery>=3.46.2",
    "google-cloud-storage>=2.17.1,<3.2.0",
    "pandas>=2.0.0,<3.0.0",
    "prefect>=3.8.8",
    "pyarrow>=25.0.1",
    "pyspark>=3.4.0,<4.0.0",
    "python-dotenv>=1.2.4",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
[tool.uv]
exclude-dependencies = ["dbt-core-experimental-parser"]
